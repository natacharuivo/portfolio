<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Conversation Video</title>
    <style>
      :root {
        --bg-1: #101827;
        --bg-2: #1b2433;
        --wall: #d9d0c1;
        --floor: #7e5d45;
        --accent: #e6b26d;
        --speaker-1: #d27d4e;
        --speaker-2: #5c7ad3;
        --bubble-1: #f7e8d7;
        --bubble-2: #e9ebff;
        --text: #14202b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        font-family: Arial, Helvetica, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        color: white;
      }

      .app {
        width: min(92vw, 1200px);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .video-stage {
        position: relative;
        width: 100%;
        height: min(70vh, 680px);
        background: linear-gradient(to bottom, #d9d0c1 0%, #d9d0c1 72%, #8e674e 72%, #6f4838 100%);
        overflow: hidden;
        border-radius: 22px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        border: 1px solid rgba(255,255,255,0.12);
      }

      .window {
        position: absolute;
        left: 50%;
        top: 15%;
        width: 180px;
        height: 130px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(180,220,255,0.85), rgba(120,170,210,0.82));
        border: 10px solid #b18b64;
        border-radius: 10px;
        box-shadow: inset 0 0 0 4px rgba(255,255,255,0.25);
      }

      .window::before,
      .window::after {
        content: "";
        position: absolute;
        background: rgba(255,255,255,0.45);
      }

      .window::before {
        left: 50%;
        top: 0;
        width: 8px;
        height: 100%;
        transform: translateX(-50%);
      }

      .window::after {
        left: 0;
        top: 50%;
        width: 100%;
        height: 8px;
        transform: translateY(-50%);
      }

      .lamp {
        position: absolute;
        left: 15%;
        top: 6%;
        width: 18px;
        height: 140px;
        background: linear-gradient(to bottom, #454d60, #161b2a);
        border-radius: 10px;
      }

      .lamp::before {
        content: "";
        position: absolute;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,246,197,0.95), rgba(255,224,132,0.5) 55%, rgba(255,176,60,0.15) 100%);
        top: -18px;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 25px rgba(255,208,90,0.8);
      }

      .table {
        position: absolute;
        left: 50%;
        bottom: 16%;
        width: 72%;
        height: 16px;
        background: linear-gradient(to right, #7d513b, #9f6c4e, #7d513b);
        transform: translateX(-50%);
        border-radius: 10px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.22);
      }

      .table::before {
        content: "";
        position: absolute;
        inset: -12px 8% 0 8%;
        border-radius: 12px;
        background: rgba(0,0,0,0.12);
      }

      .person {
        position: absolute;
        bottom: 14%;
        width: 150px;
        height: 280px;
        transition: transform 0.5s ease, left 0.7s ease;
      }

      .person .head {
        position: absolute;
        left: 50%;
        top: 0;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        transform: translateX(-50%);
        z-index: 2;
      }

      .person .body {
        position: absolute;
        left: 50%;
        top: 48px;
        width: 90px;
        height: 120px;
        transform: translateX(-50%);
        border-radius: 18px 18px 10px 10px;
      }

      .person .arm {
        position: absolute;
        top: 74px;
        width: 20px;
        height: 90px;
        border-radius: 20px;
        transform-origin: top center;
      }

      .person .arm.left { left: 16px; transform: rotate(18deg); }
      .person .arm.right { right: 16px; transform: rotate(-18deg); }

      .person .leg {
        position: absolute;
        top: 154px;
        width: 20px;
        height: 104px;
        border-radius: 14px;
      }

      .person .leg.left { left: 46px; }
      .person .leg.right { right: 46px; }

      .person.speaker-a {
        left: 24%;
      }

      .person.speaker-b {
        left: 65%;
      }

      .speaker-a .head { background: #d9a77d; }
      .speaker-a .body { background: var(--speaker-1); }
      .speaker-a .arm, .speaker-a .leg { background: #b76a3c; }

      .speaker-b .head { background: #d6bf9d; }
      .speaker-b .body { background: var(--speaker-2); }
      .speaker-b .arm, .speaker-b .leg { background: #3a54aa; }

      .person.talking {
        transform: translateY(-8px) scale(1.02);
      }

      .person.talking .head {
        animation: nod 0.45s ease-in-out infinite alternate;
      }

      .person.talking .arm.left { animation: leftWave 0.45s ease-in-out infinite alternate; }
      .person.talking .arm.right { animation: rightWave 0.45s ease-in-out infinite alternate; }

      .bubble {
        position: absolute;
        max-width: 260px;
        min-width: 180px;
        padding: 16px 18px;
        border-radius: 18px;
        font-size: 1.05rem;
        line-height: 1.4;
        color: var(--text);
        box-shadow: 0 12px 28px rgba(0,0,0,0.18);
        opacity: 0;
        transform: translateY(16px) scale(0.96);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      .bubble.active {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .bubble::after {
        content: "";
        position: absolute;
        bottom: -10px;
        width: 20px;
        height: 20px;
        background: inherit;
        transform: rotate(45deg);
      }

      .bubble.a {
        left: 18%;
        top: 15%;
        background: var(--bubble-1);
      }

      .bubble.a::after {
        left: 22px;
      }

      .bubble.b {
        right: 18%;
        top: 15%;
        background: var(--bubble-2);
      }

      .bubble.b::after {
        right: 22px;
      }

      .caption {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: min(80%, 780px);
        background: rgba(11, 17, 27, 0.38);
        border: 1px solid rgba(255,255,255,0.12);
        color: white;
        padding: 12px 18px;
        border-radius: 12px;
        text-align: center;
        font-size: clamp(1rem, 1.7vw, 1.35rem);
        letter-spacing: 0.02em;
        backdrop-filter: blur(4px);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 12px 18px;
        border-radius: 16px;
      }

      .controls button {
        appearance: none;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 0.96rem;
        font-weight: 700;
        background: linear-gradient(135deg, #f4d29f, #d7a657);
        color: #1f1d1b;
        cursor: pointer;
      }

      .controls button.secondary {
        background: rgba(255,255,255,0.08);
        color: white;
      }

      textarea {
        width: 100%;
        min-height: 140px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(12, 16, 24, 0.6);
        color: white;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 0.96rem;
        resize: vertical;
      }

      .script-meta {
        font-size: 0.9rem;
        color: rgba(255,255,255,0.75);
      }

      @keyframes nod {
        0% { transform: translateX(-50%) rotate(-2deg); }
        100% { transform: translateX(-50%) rotate(3deg); }
      }

      @keyframes leftWave {
        0% { transform: rotate(22deg); }
        100% { transform: rotate(48deg); }
      }

      @keyframes rightWave {
        0% { transform: rotate(-22deg); }
        100% { transform: rotate(-48deg); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="video-stage" aria-label="Animated room with two people speaking">
        <div class="lamp"></div>
        <div class="window"></div>
        <div class="table"></div>

        <div class="person speaker-a">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="person speaker-b">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>

        <div class="bubble a">Hi, I’m ready to start.</div>
        <div class="bubble b">Great. Let’s go through the plan together.</div>
        <div class="caption">Scene starts</div>
      </div>

      <div class="controls">
        <button id="playBtn" type="button">Play script</button>
        <button class="secondary" id="resetBtn" type="button">Reset</button>
        <div class="script-meta">Format: each line as [00:00] Speaker: Dialogue</div>
      </div>

      <textarea id="scriptArea" spellcheck="false">[00:00] Alex: Hi, I’m ready to start.
[00:03] Sam: Great. Let’s go through the plan together.
[00:07] Alex: I think the main problem is the team is moving too slowly.
[00:11] Sam: Agreed. We need a clearer process and faster milestones.
[00:16] Alex: So we’ll focus on the essentials first and leave the extras for later.
[00:21] Sam: Exactly. That way we keep quality high and deadlines realistic.
[00:27] Alex: Perfect. Let’s begin with the first task.
[00:31] Sam: Good. I’ll start the research and you can handle the outline.</textarea>
    </div>

    <script>
      const stage = document.querySelector('.video-stage');
      const caption = document.querySelector('.caption');
      const scriptArea = document.getElementById('scriptArea');
      const playBtn = document.getElementById('playBtn');
      const resetBtn = document.getElementById('resetBtn');
      const personA = document.querySelector('.speaker-a');
      const personB = document.querySelector('.speaker-b');
      const bubbleA = document.querySelector('.bubble.a');
      const bubbleB = document.querySelector('.bubble.b');

      let playbackTimer = null;
      let currentPlayback = [];

      function parseScript(raw) {
        return raw
          .split(/\n/)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const match = line.match(/^\[(\d{2}:\d{2})\]\s*([^:]+):\s*(.+)$/);
            if (!match) {
              return null;
            }
            const [, time, speaker, dialogue] = match;
            const seconds = timeToSeconds(time);
            return { time: seconds, speaker: speaker.trim(), dialogue: dialogue.trim() };
          })
          .filter(Boolean);
      }

      function timeToSeconds(value) {
        const [m, s] = value.split(':').map(Number);
        return m * 60 + s;
      }

      function setActiveSpeaker(name, dialogue) {
        const isA = name.toLowerCase().startsWith('a') || name.toLowerCase().includes('alex') || name.toLowerCase().includes('alice');
        personA.classList.toggle('talking', !isA);
        personB.classList.toggle('talking', isA);

        bubbleA.classList.toggle('active', !isA);
        bubbleB.classList.toggle('active', isA);

        if (!isA) {
          bubbleA.textContent = dialogue;
          caption.textContent = `${name}: ${dialogue}`;
        } else {
          bubbleB.textContent = dialogue;
          caption.textContent = `${name}: ${dialogue}`;
        }
      }

      function resetScene() {
        clearTimeout(playbackTimer);
        personA.classList.remove('talking');
        personB.classList.remove('talking');
        bubbleA.classList.remove('active');
        bubbleB.classList.remove('active');
        caption.textContent = 'Scene ready';
      }

      function playScript() {
        resetScene();
        currentPlayback = parseScript(scriptArea.value);
        if (!currentPlayback.length) {
          caption.textContent = 'Add script lines in the format [00:00] Name: Dialogue';
          return;
        }

        const start = performance.now();
        const totalDuration = currentPlayback[currentPlayback.length - 1].time + 4;

        const runLoop = () => {
          const elapsed = (performance.now() - start) / 1000;
          const matched = currentPlayback.findLast((item) => item.time <= elapsed);

          if (matched) {
            setActiveSpeaker(matched.speaker, matched.dialogue);
          }

          if (elapsed < totalDuration) {
            playbackTimer = setTimeout(runLoop, 120);
          } else {
            resetScene();
            caption.textContent = 'Script complete';
          }
        };

        runLoop();
      }

      playBtn.addEventListener('click', playScript);
      resetBtn.addEventListener('click', () => {
        resetScene();
        bubbleA.textContent = 'Hi, I’m ready to start.';
        bubbleB.textContent = 'Great. Let’s go through the plan together.';
      });
    </script>
  </body>
</html>
